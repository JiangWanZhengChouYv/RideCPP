name: RideCPP

options:
  bundleIdPrefix: com.ridecpp
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
    ENABLE_APP_SANDBOX: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    CLANG_ENABLE_MODULES: "YES"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
    # The Swift macro plugin server cannot start inside the driver sandbox in this
    # environment ("sandbox-exec: sandbox_apply: Operation not permitted"), which
    # breaks @State/@Observable. Disabling the driver sandbox for the compiler is
    # what lets the macro plugin load. Verified locally on this machine.
    OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-sandbox"
    OTHER_LDFLAGS: "$(inherited)"

targets:
  EditorCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/EditorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridecpp.EditorCore
        PRODUCT_NAME: EditorCore
        SKIP_INSTALL: "YES"
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  EditorWindow:
    type: framework
    platform: macOS
    sources:
      - path: Sources/EditorWindow
    dependencies:
      - target: EditorCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridecpp.EditorWindow
        PRODUCT_NAME: EditorWindow
        SKIP_INSTALL: "YES"
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  BuildKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/BuildKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridecpp.BuildKit
        PRODUCT_NAME: BuildKit
        SKIP_INSTALL: "YES"
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  RideCPP:
    type: application
    platform: macOS
    sources:
      - path: Sources/RideCPP
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: EditorWindow
        embed: true
      - target: EditorCore
        embed: true
      - target: BuildKit
        embed: true
    info:
      path: Sources/RideCPP/Info.plist
      properties:
        # Derived from PRODUCT_NAME so a renamed build (the /Applications test
        # copy, "RideCpp-Test") shows its own name in the menu bar and Dock
        # instead of claiming to be the stable install.
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        CFBundleIconName: AppIcon
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
        # Version numbers come from MARKETING_VERSION / CURRENT_PROJECT_VERSION
        # (and the matching entries in Info.plist), so there is one place to bump.
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "RideCPP"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: C++ Source
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.c-plus-plus-source
              - public.c-source
              - public.c-header
              - public.cplusplus-header
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridecpp.RideCPP
        PRODUCT_NAME: RideCPP
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  EditorCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/EditorCoreTests
    dependencies:
      - target: EditorCore

  EditorWindowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/EditorWindowTests
    dependencies:
      - target: EditorWindow
      - target: EditorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridecpp.EditorWindowTests
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"

  BuildKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BuildKitTests
    dependencies:
      - target: BuildKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridecpp.BuildKitTests
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"

schemes:
  RideCPP:
    build:
      targets:
        RideCPP: all
        EditorWindow: all
        EditorCore: all
        BuildKit: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EditorCoreTests
        - EditorWindowTests
        - BuildKitTests
  EditorCore:
    build:
      targets:
        EditorCore: all
    test:
      config: Debug
      targets:
        - EditorCoreTests
  BuildKit:
    build:
      targets:
        BuildKit: all
    test:
      config: Debug
      targets:
        - BuildKitTests
