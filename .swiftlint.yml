# SwiftLint configuration for RideCPP.
#
# Goal: zero violations by 1.3.0. Until then the rules below are set to the
# thresholds this codebase already meets, and are tightened as the code is cleaned
# up — a permanently-red lint is worse than one with honest, reachable limits.

included:
  - Sources
  - Tests

excluded:
  - build
  - build-release
  - dist
  - RideCPP.xcodeproj

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - implicit_return
  - last_where
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

disabled_rules:
  - todo
  - trailing_whitespace
  - explicit_acl          # frameworks annotate selectively, not exhaustively
  - explicit_top_level_acl
  - missing_docs          # documenting every public API is a separate pass
  - file_header           # no per-file licence headers in this project
  - no_extension_access_modifier
  - multiline_function_chains
  # `masterFD` / `slaveFD` are the POSIX pseudo-terminal terms used by
  # `openpty(&master, &slave, …)`; renaming them would obscure the mapping to the
  # system API rather than improve anything.
  - inclusive_language
  # `String(decoding:as:)` is deliberate for subprocess and terminal output: it
  # replaces malformed bytes instead of returning nil, so a stray non-UTF-8 byte in
  # a compiler message can never crash or blank out the output.
  - optional_data_string_conversion

# Thresholds sized to today's code so the run stays actionable; ratcheted down
# toward the Swift defaults as files get split.
line_length:
  warning: 130
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 500
  error: 700

file_length:
  warning: 800
  error: 1200

function_body_length:
  warning: 120
  error: 200

function_parameter_count:
  warning: 8
  error: 12

cyclomatic_complexity:
  warning: 25
  error: 40

identifier_name:
  min_length: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - i
    - j
    - n
    - s
    - p
    - v
    - a
    - b
    - c
    - d
    - f

type_name:
  min_length: 2
  max_length:
    warning: 50
    error: 60

nesting:
  type_level: 3
  function_level: 3
