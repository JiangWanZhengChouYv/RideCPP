# Continuous integration: lint, build and test on every push and pull request.
#
# SwiftLint runs in non-blocking mode for now: violations are reported as a build
# annotation and uploaded as an artifact, but do not fail the job. The goal is zero
# violations by 1.3.0, after which this can switch to `--strict`.
name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: |
          set -euo pipefail
          swiftlint version
          # Report every violation without failing the job yet.
          swiftlint lint --reporter github-actions-logging 2>&1 | tee swiftlint.log || true
          count=$(grep -cE "warning:|error:" swiftlint.log || true)
          echo "::notice title=SwiftLint::${count} violation(s) — target: 0 by 1.3.0"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftlint-report
          path: swiftlint.log

  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build-for-testing \
            -project RideCPP.xcodeproj -scheme RideCPP -configuration Debug \
            -derivedDataPath build \
            CLANG_MODULE_CACHE_PATH="$PWD/build/ModuleCache" \
            SWIFT_MODULE_CACHE_PATH="$PWD/build/ModuleCache" \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Run tests
        run: |
          set -euo pipefail
          # `xcodebuild test` cannot start a pseudo-terminal on CI runners, so the
          # bundles are executed directly.
          for bundle in EditorCoreTests EditorWindowTests BuildKitTests; do
            echo "=== $bundle ==="
            xcrun xctest "build/Build/Products/Debug/$bundle.xctest"
          done
